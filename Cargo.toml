[package]
name = "aerotop"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"
libc = "0.2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
