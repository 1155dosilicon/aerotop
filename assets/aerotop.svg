<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>AeroTop</title>
  <defs>
    <!-- vidro azul da bolha -->
    <radialGradient id="glass" cx="50%" cy="38%" r="68%">
      <stop offset="0" stop-color="#bff1ff"/>
      <stop offset="0.45" stop-color="#5ec8ff"/>
      <stop offset="0.85" stop-color="#0178d4"/>
      <stop offset="1" stop-color="#0a4f8f"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#1f4f6e"/>
    </linearGradient>
    <!-- tela escura do monitor -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a40"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#17c21a"/>
      <stop offset="1" stop-color="#7dff7d"/>
    </linearGradient>
    <!-- reflexo do vidro no topo -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="58" y="70" width="140" height="112" rx="14"/>
    </clipPath>
  </defs>

  <!-- sombra -->
  <ellipse cx="128" cy="236" rx="84" ry="12" fill="url(#shadow)"/>

  <!-- bolha -->
  <circle cx="128" cy="124" r="108" fill="url(#rim)"/>
  <circle cx="128" cy="124" r="103" fill="url(#glass)"/>

  <!-- tela com os medidores -->
  <rect x="54" y="66" width="148" height="120" rx="17" fill="#0f1a2b" stroke="#8fd3ff" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="58" y="70" width="140" height="112" rx="14" fill="url(#screen)"/>
  <g clip-path="url(#screenClip)">
    <!-- grade -->
    <g stroke="#2e4a66" stroke-width="1" opacity="0.6">
      <line x1="58" y1="98" x2="198" y2="98"/>
      <line x1="58" y1="126" x2="198" y2="126"/>
      <line x1="58" y1="154" x2="198" y2="154"/>
    </g>
    <!-- trilhos apagados -->
    <g fill="#0c3a12">
      <rect x="80" y="84" width="18" height="86" rx="3"/>
      <rect x="106" y="84" width="18" height="86" rx="3"/>
      <rect x="132" y="84" width="18" height="86" rx="3"/>
      <rect x="158" y="84" width="18" height="86" rx="3"/>
    </g>
    <!-- barras acesas -->
    <g fill="url(#lit)">
      <rect x="80" y="124" width="18" height="46" rx="3"/>
      <rect x="106" y="98" width="18" height="72" rx="3"/>
      <rect x="132" y="140" width="18" height="30" rx="3"/>
      <rect x="158" y="110" width="18" height="60" rx="3"/>
    </g>
    <!-- linha da zram -->
    <polyline points="62,150 84,136 106,142 130,112 152,120 176,94 196,100"
              fill="none" stroke="#5ec8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- reflexo do vidro -->
  <path d="M40 104 C44 52 88 24 128 24 C168 24 212 52 216 104 C186 82 158 76 128 76 C98 76 70 82 40 104 Z"
        fill="url(#shine)"/>
  <ellipse cx="78" cy="196" rx="14" ry="7" fill="#ffffff" opacity="0.35" transform="rotate(-35 78 196)"/>
</svg>
